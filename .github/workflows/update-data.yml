name: 鹿児島県データ自動更新

on:
  schedule:
    - cron: '0 1 1 * *'  # 毎月1日 JST10:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（Supabaseへの書き込みをスキップ）'
        required: false
        default: 'false'

jobs:
  鹿児島県データ更新:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install -r scripts/requirements.txt

      - name: 鹿児島データ更新スクリプト実行
        run: python scripts/update_kagoshima_data.py
        continue-on-error: true

      - name: 仙台データ更新スクリプト実行
        run: python scripts/update_sendai_data.py
        continue-on-error: true

      - name: 愛知データ更新スクリプト実行
        run: python scripts/update_nagoya_data.py
        continue-on-error: true

      - name: 実行結果をサマリに出力
        run: |
          echo "## 実行結果" >> $GITHUB_STEP_SUMMARY
          echo "- 実行日時: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')" >> $GITHUB_STEP_SUMMARY
          echo "- ステータス: success" >> $GITHUB_STEP_SUMMARY
