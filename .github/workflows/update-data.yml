name: Monthly Data Update

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        default: "false"

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update Kagoshima
        run: python scripts/update_kagoshima_data.py
        continue-on-error: true

      - name: Update Sendai
        run: python scripts/update_sendai_data.py
        continue-on-error: true

      - name: Update Nagoya
        run: python scripts/update_nagoya_data.py
        continue-on-error: true

      - name: Update Tokai
        run: python scripts/update_tokai_data.py
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Result" >> $GITHUB_STEP_SUMMARY
          echo "- Done" >> $GITHUB_STEP_SUMMARY
