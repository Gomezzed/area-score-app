name: Monthly Data Update

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run
        required: false
        default: "false"

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── 既存エリア ──────────────────────────────────────────
      - name: Update Kagoshima
        run: python scripts/update_kagoshima_data.py
        working-directory: scripts
        continue-on-error: true

      - name: Update Sendai
        run: python scripts/update_sendai_data.py
        working-directory: scripts
        continue-on-error: true

      - name: Update Nagoya (Aichi)
        run: python scripts/update_nagoya_data.py
        working-directory: scripts
        continue-on-error: true

      # ── 新規リージョン ──────────────────────────────────────
      - name: Update Tohoku (Hokkaido + Tohoku 7 prefs)
        run: python scripts/update_tohoku_data.py
        working-directory: scripts
        continue-on-error: true

      - name: Update Hokuriku (6 prefs)
        run: python scripts/update_hokuriku_data.py
        working-directory: scripts
        continue-on-error: true

      - name: Update Chugoku-Shikoku (9 prefs)
        run: python scripts/update_chugoku_shikoku_data.py
        working-directory: scripts
        continue-on-error: true

      - name: Update Kyushu-Okinawa (7 prefs)
        run: python scripts/update_kyushu_data.py
        working-directory: scripts
        continue-on-error: true

      # ── 不動産取引データ ────────────────────────────────────
      - name: Fetch Real Estate Transactions
        run: python scripts/fetch_realestate_transactions.py
        working-directory: scripts
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Monthly Data Update" >> $GITHUB_STEP_SUMMARY
          echo "- Completed at $(date)" >> $GITHUB_STEP_SUMMARY
